<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCSO Department Portal</title><link rel="stylesheet" href="style.css"></head><body>
<div id="loginView" class="login-view"><div class="login-card"><div class="seal">★</div><div class="eyebrow">BLAINE COUNTY • SAN ANDREAS</div><h1>BCSO Portal</h1><p>Secure department access</p><form id="loginForm"><label>Callsign<input id="loginCallsign" inputmode="numeric" required placeholder="Enter callsign"></label><label>Password<div class="pass"><input id="loginPassword" type="password" required placeholder="Enter password"><button type="button" onclick="togglePassword('loginPassword')">◉</button></div></label><button class="primary wide">Sign In</button><div id="loginError" class="error"></div></form><small class="demo-note">Demo accounts are enabled for this prototype.</small></div></div>
<div id="appView" class="app hidden"><aside class="sidebar"><div class="brand"><span class="mini-seal">★</span><div><b>BCSO</b><small>DEPARTMENT PORTAL</small></div></div><div class="userbox"><strong id="sideName"></strong><span id="sideRole"></span><small id="sideRank"></small></div><nav id="sideNav"><button data-page="dashboard">▣ Dashboard</button><button data-page="roster">♟ Roster</button><button data-page="reports">▤ Reports</button><button data-page="sops">▥ SOPs</button><button data-page="announcements">⚑ Announcements</button><button data-page="subdivisions" class="admin-only">⌘ Subdivisions</button><button data-page="users" class="admin-only">♙ User Management</button></nav><button class="logout" onclick="logout()">↪ Sign Out</button></aside><main class="main"><header class="top"><div><span class="eyebrow">BLAINE COUNTY SHERIFF'S OFFICE</span><h2 id="pageTitle">Dashboard</h2></div><div class="top-right"><span class="live">● ONLINE</span><button class="mobile-menu" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button></div></header><div id="page" class="page"></div></main></div>
<div id="modal" class="modal"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><script src="script.js"></script></body></html>
